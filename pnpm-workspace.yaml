packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true

# docs/25, S-01: proxy-addr < 2.0.8 permite falsear la IP (llega por Express). Patch de la misma versión mayor.
overrides:
  proxy-addr: ^2.0.8
  # docs/25, S-03 (Echu, 2026-11-03): las de severidad alta que no se resuelven subiendo la
  # dependencia directa. Siempre el parche de la misma versión mayor que ya se usa.
  undici@6: ^6.29.1 # @nestjs/mau (herramienta de desarrollo) lo fija en 6.20.1
  undici@7: ^7.30.1 # shadcn > @dotenvx/dotenvx
  tmp: ^0.2.6 # @nestjs/mau > inquirer > external-editor
  multer: ^2.5.0 # también el de @nestjs/platform-express
  source-map-js: ^1.2.2 # postcss
  sharp: ^0.35.5 # @sentry/nextjs > webpack
  markdown-it: ^14.3.3 # tiptap-markdown
  body-parser: ^2.4.0 # shadcn > @modelcontextprotocol/sdk > express
  systeminformation: ^5.33.16 # shadcn > @dotenvx/dotenvx
  '@modelcontextprotocol/sdk': ^1.32.0 # shadcn
  zod@4: ^4.6.6
